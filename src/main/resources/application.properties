spring.application.name=apigateway-service
server.port=9000

# Dùng biến môi trường, nếu không có sẽ tự nhận giá trị localhost cho local dev
spring.cloud.gateway.routes[0].id=payment-service
spring.cloud.gateway.routes[0].uri=${PAYMENT_SERVICE_URI:http://localhost:8084}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=${ORDER_SERVICE_URI:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.routes[2].id=inventory-service
spring.cloud.gateway.routes[2].uri=${INVENTORY_SERVICE_URI:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/inventories/**

# Tracing & Actuator
management.endpoints.web.exposure.include=*
management.prometheus.metrics.export.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://tempo.microservices-ns.svc.cluster.local:4317
logging.pattern.level=%d{yyyy-MM-dd HH:mm:ss} [%X{traceId:-},%X{spanId:-}] [%thread] %-5level %logger{36} - %msg%n